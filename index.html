<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>8v8 Realistic Combat Arena - Smooth Physics & Detailed Animation</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    overflow-x: hidden;
    max-width: 100vw;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1c222b 0%, #090c10 80%);
    color: #f3f4f6;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
  }

  .game-box {
    width: 100%;
    max-width: 560px;
    min-width: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #1a2029 0%, #10141a 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 24px 54px rgba(0, 0, 0, 0.92), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 9px;
    color: #e5e7eb;
  }

  .stage-pill {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #e5e7eb;
    padding: 3px 11px;
    border-radius: 99px;
    font-size: 12px;
  }

  /* VILLAIN ROSTER UI */
  .villain-roster {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
    margin-bottom: 8px;
    background: rgba(9, 12, 16, 0.78);
    padding: 6px;
    border-radius: 13px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 100%;
    min-width: 0;
  }

  .v-slot {
    min-width: 0;
    overflow: hidden;
    background: rgba(31, 36, 45, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 9px;
    padding: 5px 3px;
    text-align: center;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .v-slot.current {
    border-color: #eab308;
    background: rgba(66, 52, 24, 0.65);
    box-shadow: 0 0 12px rgba(234, 179, 8, 0.22);
    transform: translateY(-1px);
  }

  .v-slot.defeated {
    opacity: 0.34;
    background: rgba(15, 18, 23, 0.5);
    border-color: rgba(255, 255, 255, 0.05);
  }

  .v-slot .v-nm {
    font-size: 10px;
    font-weight: 800;
    color: #f3f4f6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .v-slot.defeated .v-nm {
    text-decoration: line-through;
    color: #9ca3af;
  }

  .v-slot .v-st {
    font-size: 8.5px;
    color: #fca5a5;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* DETAILED REALISTIC ARENA */
  .arena {
    position: relative;
    height: 315px;
    background:
      radial-gradient(ellipse at var(--sun-x, 52%) var(--sun-y, 26%), var(--bg-sun-glow, rgba(226, 185, 130, 0.22)) 0%, transparent 56%),
      linear-gradient(180deg, var(--bg-sky-top, #1b232e) 0%, var(--bg-sky-mid, #37414e) 58%, var(--bg-ground-top, #43403b) 58%, var(--bg-ground-bot, #181614) 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 10px;
    box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.82);
    transition: background 0.5s ease;
    transform-origin: center center;
  }

  .bg-celestial {
    position: absolute;
    top: var(--sun-y, 24%);
    left: var(--sun-x, 52%);
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--bg-sun-core, rgba(254, 243, 199, 0.72)) 0%, var(--bg-sun-glow, rgba(217, 179, 120, 0.25)) 62%, transparent 100%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 1;
  }

  .arena::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 58%, transparent 52%, rgba(0, 0, 0, 0.52) 100%);
    pointer-events: none;
    z-index: 6;
  }

  .bg-detail-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .bg-haze {
    position: absolute;
    left: 0;
    right: 0;
    top: 48%;
    height: 50px;
    background: linear-gradient(180deg, transparent 0%, var(--bg-haze, rgba(200, 195, 185, 0.12)) 55%, transparent 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* CINEMATIC CAMERA ZOOM & SHAKE */
  .arena.cam-zoom-right {
    animation: camZoomRight 0.68s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .arena.cam-zoom-left {
    animation: camZoomLeft 0.68s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .arena.cam-heavy-impact {
    animation: camHeavyImpact 0.52s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes camZoomRight {
    0% { transform: scale(1) translate(0, 0); }
    35% { transform: scale(1.045) translate(-10px, -4px); }
    52% { transform: scale(1.06) translate(-16px, -6px); }
    62% { transform: scale(1.055) translate(-8px, -2px); }
    100% { transform: scale(1) translate(0, 0); }
  }

  @keyframes camZoomLeft {
    0% { transform: scale(1) translate(0, 0); }
    35% { transform: scale(1.045) translate(10px, -4px); }
    52% { transform: scale(1.06) translate(16px, -6px); }
    62% { transform: scale(1.055) translate(8px, -2px); }
    100% { transform: scale(1) translate(0, 0); }
  }

  @keyframes camHeavyImpact {
    0% { transform: scale(1.05) translate(0, 0); }
    15% { transform: scale(1.07) translate(-9px, 5px); }
    30% { transform: scale(1.06) translate(8px, -4px); }
    48% { transform: scale(1.04) translate(-5px, 3px); }
    68% { transform: scale(1.02) translate(4px, -2px); }
    100% { transform: scale(1) translate(0, 0); }
  }

  .impact-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--fx-x, 70%) 65%, rgba(255, 255, 255, 0.55), rgba(250, 204, 21, 0.2), transparent 68%);
    opacity: 0;
    pointer-events: none;
    z-index: 8;
  }

  .impact-flash.active {
    animation: hitFlashAnim 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes hitFlashAnim {
    0% { opacity: 0.95; }
    100% { opacity: 0; }
  }

  /* REALISTIC HUD + POWER BAR */
  .hud-row {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    z-index: 10;
  }

  .hud-side {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(14, 17, 23, 0.88);
    backdrop-filter: blur(8px);
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .hud-name span, .hud-sub span, .hud-spell-tag span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .hud-name {
    font-size: 11.5px;
    font-weight: bold;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
  }

  .hud-sub {
    font-size: 9px;
    color: #9ca3af;
    margin-bottom: 3px;
    display: flex;
    justify-content: space-between;
  }

  .hud-spell-tag {
    font-size: 9px;
    color: #fcd34d;
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .status-pill {
    font-size: 8.5px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: bold;
    background: rgba(56, 189, 248, 0.2);
    color: #7dd3fc;
  }

  .hp-track {
    height: 8px;
    background: rgba(5, 7, 10, 0.92);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
  }

  .pwr-track {
    height: 6px;
    margin-top: 4px;
    background: rgba(5, 7, 10, 0.92);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid rgba(56, 189, 248, 0.25);
  }

  .hp-bar-hero {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .pwr-bar-hero {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #06b6d4, #38bdf8, #a855f7);
    transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .hp-bar-villain {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #b91c1c, #ef4444);
    transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .vs-badge {
    font-weight: 900;
    font-size: 13px;
    color: #facc15;
    margin-top: 18px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
  }

  /* =========================================================
     4D DEPTH, VOLUMETRIC RIM-LIGHT & MULTI-PLANE FIGHTER RIG
     ========================================================= */
  .fighter-anchor {
    position: absolute;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
    perspective: 420px;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .fighter-body-wrap {
    position: relative;
    width: 104px;
    height: 116px;
    transform-origin: 52px 105px;
    transform-style: preserve-3d;
    will-change: transform, filter;
  }

  .villain-anchor .fighter-body-wrap {
    transform: scaleX(-1);
  }

  .body-svg {
    width: 104px;
    height: 116px;
    overflow: visible;
    filter:
      drop-shadow(0 10px 14px rgba(0, 0, 0, 0.9))
      drop-shadow(0 0 8px var(--char-aura, rgba(56, 189, 248, 0.25)));
  }

  .layer-back {
    opacity: 0.78;
    filter: brightness(0.76) saturate(0.85);
  }

  .layer-mid {
    filter: brightness(1.02) contrast(1.06);
  }

  .layer-front {
    filter: brightness(1.12) contrast(1.1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.24));
  }

  .aura-ring {
    position: absolute;
    bottom: 14px;
    width: 82px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--char-aura, rgba(56, 189, 248, 0.55));
    box-shadow: 0 0 14px var(--char-aura, rgba(56, 189, 248, 0.45)), inset 0 0 10px var(--char-aura, rgba(56, 189, 248, 0.3));
    pointer-events: none;
    z-index: -1;
    animation: auraPulse4D 2.2s ease-in-out infinite;
  }

  @keyframes auraPulse4D {
    0%, 100% { transform: scale(0.94) rotateX(62deg); opacity: 0.65; }
    50% { transform: scale(1.12) rotateX(62deg); opacity: 1; }
  }

  /* Articulated Joint Origins */
  .joint-torso { transform-origin: 48px 66px; }
  .joint-head { transform-origin: 48px 34px; }
  .joint-back-arm { transform-origin: 44px 39px; }
  .joint-front-arm { transform-origin: 52px 39px; }
  .joint-back-leg { transform-origin: 44px 66px; }
  .joint-front-leg { transform-origin: 52px 66px; }

  /* Realistic Breathing Combat Stance (Idle) */
  .hero-anchor.idle .fighter-body-wrap {
    animation: idleBreathHero 1.45s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  }
  .villain-anchor.idle .fighter-body-wrap {
    animation: idleBreathVillain 1.55s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  }
  .idle .joint-front-arm {
    animation: guardBobFront 1.45s ease-in-out infinite;
  }
  .idle .joint-back-arm {
    animation: guardBobBack 1.45s ease-in-out infinite;
  }
  .idle .joint-torso {
    animation: torsoSway 1.45s ease-in-out infinite;
  }

  @keyframes idleBreathHero {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(2.5px) scaleY(0.975) scaleX(1.015); }
  }
  @keyframes idleBreathVillain {
    0%, 100% { transform: scaleX(-1) translateY(0) scaleY(1); }
    50% { transform: scaleX(-1) translateY(2.5px) scaleY(0.975) scaleX(1.015); }
  }
  @keyframes guardBobFront {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(5deg) translateY(1px); }
  }
  @keyframes guardBobBack {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-4deg) translateY(1px); }
  }
  @keyframes torsoSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(2deg); }
  }

  /* Realistic Ground Shadow that scales with jump/dash */
  .ground-shadow {
    width: 68px;
    height: 13px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 55%, transparent 78%);
    border-radius: 50%;
    margin-top: -6px;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  .head-img-overlay {
    position: absolute;
    top: 10px;
    left: 34px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
    pointer-events: none;
  }
  .villain-anchor .head-img-overlay {
    transform: scaleX(-1);
    border-color: #fca5a5;
  }

  /* =========================================================
     1. REALISTIC MELEE COMBO (Anticipation -> Dash -> 1-2 Strike -> Recovery)
     ========================================================= */
  .hero-anchor.anim-melee {
    z-index: 9;
    animation: heroMeleeDash 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-melee .fighter-body-wrap {
    animation: heroMeleeBody 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-melee .joint-front-arm {
    animation: meleePunchLead 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-melee .joint-back-arm {
    animation: meleePunchCross 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-melee .joint-front-leg {
    animation: meleeLungeLeg 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-melee .joint-back-leg {
    animation: meleeTrailLeg 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .hero-anchor {
    left: 24px;
  }

  .villain-anchor {
    right: 24px;
  }

  @keyframes heroMeleeDash {
    0%   { transform: translate3d(0, 0, 0); }
    16%  { transform: translate3d(-8px, 0, 0); }
    38%  { transform: translate3d(135px, -8px, 0); }
    56%  { transform: translate3d(145px, 0, 0); }
    72%  { transform: translate3d(118px, -5px, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  @keyframes heroMeleeBody {
    0%   { transform: rotate(0deg) scaleY(1); }
    16%  { transform: rotate(-14deg) scaleY(0.92); } /* Crouch coil */
    34%  { transform: rotate(22deg) scaleY(1.04); } /* Forward lean */
    54%  { transform: rotate(28deg) scaleY(0.96); } /* Impact torque */
    74%  { transform: rotate(-12deg) scaleY(1.02); } /* Hop back balance */
    100% { transform: rotate(0deg) scaleY(1); }
  }

  @keyframes meleePunchLead {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(35deg); } /* Pull fist back */
    38%  { transform: rotate(-78deg) translate(10px, -4px); } /* Jab extension */
    55%  { transform: rotate(25deg); } /* Chamber back for cross */
    100% { transform: rotate(0deg); }
  }

  @keyframes meleePunchCross {
    0%   { transform: rotate(0deg); }
    38%  { transform: rotate(45deg); } /* Wind up rear hand */
    56%  { transform: rotate(-88deg) translate(14px, -2px); } /* Heavy cross punch */
    76%  { transform: rotate(-20deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes meleeLungeLeg {
    0%   { transform: rotate(0deg); }
    16%  { transform: rotate(18deg); }
    40%  { transform: rotate(-34deg) translateX(6px); }
    58%  { transform: rotate(-38deg) translateX(8px); }
    100% { transform: rotate(0deg); }
  }

  @keyframes meleeTrailLeg {
    0%   { transform: rotate(0deg); }
    16%  { transform: rotate(-12deg); }
    45%  { transform: rotate(36deg) translateX(-4px); }
    100% { transform: rotate(0deg); }
  }

  /* =========================================================
     2. REALISTIC SPELL CASTING POSE (Channel -> Thrust -> Recoil)
     ========================================================= */
  .hero-anchor.anim-cast {
    z-index: 9;
    animation: heroCastSlide 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-cast .fighter-body-wrap {
    animation: heroCastBody 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-anchor.anim-cast .joint-front-arm,
  .hero-anchor.anim-cast .joint-back-arm {
    animation: heroCastArms 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes heroCastSlide {
    0%   { transform: translate3d(0, 0, 0); }
    24%  { transform: translate3d(-12px, -4px, 0); } /* Gather energy */
    45%  { transform: translate3d(26px, 0, 0); } /* Palm thrust forward */
    65%  { transform: translate3d(14px, 0, 0); } /* Recoil */
    100% { transform: translate3d(0, 0, 0); }
  }
  @keyframes heroCastBody {
    0%   { transform: rotate(0deg); }
    24%  { transform: rotate(-16deg) scaleY(0.95); }
    45%  { transform: rotate(18deg) scaleY(1.03); }
    100% { transform: rotate(0deg); }
  }
  @keyframes heroCastArms {
    0%   { transform: rotate(0deg); }
    24%  { transform: rotate(42deg); }
    45%  { transform: rotate(-76deg) translate(10px, -3px); }
    75%  { transform: rotate(-60deg); }
    100% { transform: rotate(0deg); }
  }

  /* =========================================================
     3. VILLAIN COUNTER ATTACK (Smooth Lunge & Heavy Strike)
     ========================================================= */
  .villain-anchor.anim-melee {
    z-index: 9;
    animation: villainMeleeDash 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .villain-anchor.anim-melee .fighter-body-wrap {
    animation: villainMeleeBody 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .villain-anchor.anim-melee .joint-front-arm {
    animation: meleePunchLead 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .villain-anchor.anim-melee .joint-back-arm {
    animation: meleePunchCross 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes villainMeleeDash {
    0%   { transform: translate3d(0, 0, 0); }
    18%  { transform: translate3d(8px, 0, 0); }
    42%  { transform: translate3d(-135px, -7px, 0); }
    58%  { transform: translate3d(-145px, 0, 0); }
    76%  { transform: translate3d(-118px, -4px, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }
  @keyframes villainMeleeBody {
    0%   { transform: scaleX(-1) rotate(0deg); }
    18%  { transform: scaleX(-1) rotate(-14deg) scaleY(0.92); }
    42%  { transform: scaleX(-1) rotate(24deg) scaleY(1.03); }
    58%  { transform: scaleX(-1) rotate(28deg); }
    100% { transform: scaleX(-1) rotate(0deg); }
  }

  .villain-anchor.anim-cast {
    z-index: 9;
    animation: villainCastSlide 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .villain-anchor.anim-cast .fighter-body-wrap {
    animation: villainCastBody 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .villain-anchor.anim-cast .joint-front-arm,
  .villain-anchor.anim-cast .joint-back-arm {
    animation: heroCastArms 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes villainCastSlide {
    0%   { transform: translate3d(0, 0, 0); }
    24%  { transform: translate3d(12px, -4px, 0); }
    45%  { transform: translate3d(-26px, 0, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }
  @keyframes villainCastBody {
    0%   { transform: scaleX(-1) rotate(0deg); }
    24%  { transform: scaleX(-1) rotate(-16deg); }
    45%  { transform: scaleX(-1) rotate(18deg); }
    100% { transform: scaleX(-1) rotate(0deg); }
  }

  /* =========================================================
     4. REALISTIC KNOCKBACK & HIT REACTION (Hitstop + Recoil)
     ========================================================= */
  .villain-anchor.anim-hurt {
    animation: villainKnockback 0.56s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .villain-anchor.anim-hurt .fighter-body-wrap {
    animation: villainHurtFlash 0.56s ease forwards;
  }
  .villain-anchor.anim-hurt .joint-head {
    animation: headSnapBack 0.56s ease forwards;
  }

  @keyframes villainKnockback {
    0%   { transform: translate3d(0, 0, 0); }
    18%  { transform: translate3d(16px, -6px, 0); }

  ];

  const heroes = Array.from({ length: heroPalette.length }, (_, i) => ({
    ...heroPalette[i],
    name: heroPalette[i].name || ("Member " + (i + 1)),
    hp: 195 + i * 12,
    maxHp: 195 + i * 12,
    pwr: 100,
    maxPwr: 100,
    atk: 45 + i * 4,
    shielded: false
  }));

  let vIdx = 0;
  let hIdx = 0;
  let combo = 0;
  let busy = false;
  let villainStunned = false;
  let villainWeakened = false;

  const arena = document.getElementById("arena");
  const heroAnchor = document.getElementById("heroAnchor");
  const villainAnchor = document.getElementById("villainAnchor");
  const impactFlash = document.getElementById("impactFlash");
  const bgDetailSvg = document.getElementById("bgDetailSvg");

  function buildGroundDetails(sceneType) {
    let lines = `
      <line x1="0" y1="182" x2="560" y2="182" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
      <line x1="0" y1="206" x2="560" y2="206" stroke="rgba(0,0,0,0.45)" stroke-width="1.5"/>
      <line x1="0" y1="240" x2="560" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="0" y1="276" x2="560" y2="276" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>
    `;
    if (sceneType === "harbor" || sceneType === "drydock") {
      lines += `<g stroke="rgba(15,23,42,0.55)" stroke-width="1.2">
        <line x1="80" y1="182" x2="30" y2="315"/><line x1="170" y1="182" x2="132" y2="315"/>
        <line x1="280" y1="182" x2="280" y2="315"/><line x1="390" y1="182" x2="428" y2="315"/>
        <line x1="480" y1="182" x2="530" y2="315"/></g>`;
    } else if (sceneType === "railyard") {
      lines += `<g stroke="rgba(180,175,165,0.25)" stroke-width="2" fill="none">
        <line x1="98" y1="182" x2="12" y2="315"/><line x1="190" y1="182" x2="132" y2="315"/>
        <line x1="370" y1="182" x2="428" y2="315"/><line x1="462" y1="182" x2="548" y2="315"/></g>`;
    } else if (sceneType === "canyon" || sceneType === "ridge") {
      lines += `<g fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.07)" stroke-width="1">
        <polygon points="70,216 104,211 116,221 78,225"/><polygon points="434,220 476,215 488,226 444,230"/>
        <polygon points="242,262 290,257 304,270 252,273"/></g>`;
    } else {
      lines += `<g stroke="rgba(255,255,255,0.11)" stroke-width="1.5" stroke-dasharray="12 12">
        <line x1="190" y1="235" x2="370" y2="235"/></g>`;
    }
    return lines;
  }

  function buildSceneDetails(sceneType) {
    const ground = buildGroundDetails(sceneType);
    if (sceneType === "harbor" || sceneType === "drydock") {
      return `<g fill="#161d24" opacity="0.72"><rect x="0" y="96" width="68" height="86"/><rect x="80" y="116" width="58" height="66"/><rect x="422" y="112" width="66" height="70"/><rect x="494" y="90" width="66" height="92"/></g>
        <g stroke="#2a343f" stroke-width="2.2" fill="none" opacity="0.8"><line x1="176" y1="74" x2="176" y2="182"/><line x1="142" y1="84" x2="236" y2="68"/><line x1="390" y1="78" x2="390" y2="182"/><line x1="330" y1="86" x2="412" y2="78"/></g>${ground}`;
    }
    if (sceneType === "overpass" || sceneType === "viaduct") {
      return `<g fill="#191e26" opacity="0.65"><rect x="16" y="104" width="56" height="78"/><rect x="488" y="102" width="56" height="80"/></g>
        <g stroke="#2c333d" stroke-width="2" fill="none" opacity="0.85"><line x1="0" y1="116" x2="560" y2="116"/><line x1="0" y1="136" x2="560" y2="136"/><line x1="70" y1="116" x2="70" y2="182"/><line x1="186" y1="116" x2="186" y2="182"/><line x1="374" y1="116" x2="374" y2="182"/><line x1="490" y1="116" x2="490" y2="182"/></g>${ground}`;
    }
    if (sceneType === "ridge" || sceneType === "canyon") {
      return `<path d="M0 182 L0 126 L54 100 L108 130 L168 90 L226 128 L286 104 L350 136 L416 94 L484 126 L560 102 L560 182 Z" fill="#1e2227" opacity="0.68"/>
        <path d="M0 182 L0 144 L66 128 L122 156 L192 138 L266 162 L340 140 L420 160 L490 134 L560 152 L560 182 Z" fill="#2b2621" opacity="0.82"/>${ground}`;
    }
    if (sceneType === "railyard") {
      return `<g fill="#191c20" opacity="0.76"><rect x="0" y="102" width="86" height="80"/><polygon points="0,102 43,78 86,102" fill="#24282e"/><rect x="468" y="106" width="92" height="76"/></g>

    }
    if (sceneType === "fortress") {
      return `<g fill="#1c1917" opacity="0.84"><rect x="0" y="100" width="560" height="82"/><rect x="16" y="82" width="24" height="18"/><rect x="58" y="82" width="24" height="18"/><rect x="100" y="82" width="24" height="18"/><rect x="236" y="70" width="88" height="112"/><rect x="226" y="54" width="20" height="16"/><rect x="270" y="54" width="20" height="16"/><rect x="314" y="54" width="20" height="16"/><rect x="436" y="82" width="24" height="18"/><rect x="478" y="82" width="24" height="18"/><rect x="520" y="82" width="24" height="18"/></g>${ground}`;
    }
    return `<g fill="#151920" opacity="0.8"><rect x="0" y="86" width="72" height="96"/><rect x="80" y="110" width="60" height="72"/><rect x="148" y="94" width="54" height="88"/><rect x="358" y="100" width="56" height="82"/><rect x="422" y="115" width="60" height="67"/><rect x="490" y="84" width="70" height="98"/></g><circle cx="280" cy="102" r="3.5" fill="rgba(254, 240, 138, 0.7)"/>${ground}`;
  }

  function applyVillainEnvironment(v) {
    arena.style.setProperty("--bg-sky-top", v.bg.top);
    arena.style.setProperty("--bg-sky-mid", v.bg.mid);
    arena.style.setProperty("--bg-ground-top", v.bg.gTop);
    arena.style.setProperty("--bg-ground-bot", v.bg.gBot);
    arena.style.setProperty("--sun-x", v.bg.sunX);
    arena.style.setProperty("--sun-y", v.bg.sunY);
    arena.style.setProperty("--bg-sun-core", v.bg.sunCore);
    arena.style.setProperty("--bg-sun-glow", v.bg.sunGlow);
    arena.style.setProperty("--bg-haze", v.bg.haze);
    bgDetailSvg.innerHTML = buildSceneDetails(v.bg.scene);
  }

  /* 4D Depth Fighter Rig Supporting Distinct Human Archetypes: Woman, Child, Elder, Man */
  function buildFighterVisual(char, isVillain) {
    const type = char.archetype || "man";
    const accent = isVillain ? char.horn : char.band;
    const auraColor = isVillain ? (char.spell ? char.spell.color : "#f43f5e") : (char.spell ? char.spell.color : "#38bdf8");
    const hasHeadImg = char.headImg && char.headImg.trim() !== "";
    const uid = (isVillain ? "v4d_" : "h4d_") + char.name.replace(/[^a-zA-Z0-9]/g, "_");

    const isGirlChild = type === "girl_child";
    const isChild = type === "child" || isGirlChild;
    const isWoman = type === "woman";
    const isElder = type === "elder";
    const build = char.build || "normal";
    const isStrong = build === "strong";
    const isChubby = build === "chubby";
    const isVeryFat = build === "very_fat";
    const isFat = build === "fat" || isVeryFat;
    const isBlackSkin = !!char.blackskin;
    const isTall = !!char.tall;
    const hasBeard = !!char.beard;

    const headScale = isChild
      ? "translate(0, 14) scale(1.06)"
      : (isVeryFat
      ? "translate(0, 2) scale(1.08)"
      : (isFat
      ? "translate(0, 1) scale(1.05)"
      : (isTall
      ? "translate(0, -4) scale(0.96)"
      : (isElder ? "translate(0, 3) scale(0.98)" : "translate(0, 0)"))));
    const torsoTopY = isChild ? 51 : (isTall ? 29 : (isElder ? 39 : (isStrong ? 33 : 35)));
    const torsoBotY = isChild ? 70 : (isTall ? 65 : (isElder ? 66 : 64));
    const legTopY = isChild ? 70 : (isTall ? 65 : (isElder ? 66 : 65));
    const legBottomY = isTall ? 104 : 98;
    const armStroke = isChild ? 6.0 : (isVeryFat ? 11.0 : (isStrong ? 9.8 : (isFat ? 9.4 : (isChubby ? 7.6 : (isWoman ? 6.6 : (isElder ? 7.2 : 8.2))))));
    const legStroke = isChild ? 7.4 : (isVeryFat ? 12.6 : (isStrong ? 11.4 : (isFat ? 11.2 : (isChubby ? 9.2 : (isWoman ? 8.2 : (isElder ? 8.8 : 10.0))))));
    const hairColor = isElder ? "#e2e8f0" : "#18181b";
    const skinStops = isBlackSkin
      ? `<stop offset="0%" stop-color="#6b442a"/><stop offset="58%" stop-color="#472b18"/><stop offset="100%" stop-color="#241309"/>`
      : `<stop offset="0%" stop-color="#fde0b8"/><stop offset="58%" stop-color="#e3a872"/><stop offset="100%" stop-color="#9e5d31"/>`;
    const beardStrokeColor = isBlackSkin ? "#52525b" : "#09090b";
    const eyeLineColor = isBlackSkin ? "#f8fafc" : (isElder ? "#cbd5e1" : "#09090b");

    let headGear = "";
    if (isVillain) {
      headGear = `

    } else if (isWoman) {
      headGear = `

      `;
    } else if (isGirlChild) {
      headGear = `
        <!-- Girl Child Twin Pigtails & Hair Bow -->
        <path d="M34.5 19 C34.5 9, 61.5 9, 61.5 19 C58 13.5, 53 11.5, 48 11.5 C43 11.5, 38 13.5, 34.5 19 Z" fill="${hairColor}"/>

    } else if (isChild) {
      headGear = `
        <!-- Child Cap & Cute Puff -->
        <path d="M35 20 C35 9, 61 9, 61 20 C57 14, 52 12, 48 12 C44 12, 39 14, 35 20 Z" fill="${hairColor}"/>

    } else if (isElder) {

          <line x1="51.2" y1="28.4" x2="55.8" y2="28.1" stroke="${isBlackSkin ? '#fca5a5' : '#4c1d12'}" stroke-width="1.5" stroke-linecap="round"/>
          ${extraBeardSvg}
          ${headGear}

      `;

    const imgHead = "";

    const torsoPath = isVeryFat
      ? `M31 ${torsoTopY} C34 ${torsoTopY - 3}, 62 ${torsoTopY - 3}, 65 ${torsoTopY} C70 46, 70 58, 65 ${torsoBotY} L32 ${torsoBotY} C27 58, 27 46, 31 ${torsoTopY} Z`
      : isFat
      ? `M35 ${torsoTopY} C37 ${torsoTopY - 2}, 59 ${torsoTopY - 2}, 61 ${torsoTopY} C65 46, 65 57, 61 ${torsoBotY} L36 ${torsoBotY} C32 57, 32 46, 35 ${torsoTopY} Z`
      : isChubby
      ? `M37 ${torsoTopY} C38 ${torsoTopY - 2}, 58 ${torsoTopY - 2}, 59 ${torsoTopY} C62 47, 62 56, 60 ${torsoBotY} L37 ${torsoBotY} C35 56, 35 47, 37 ${torsoTopY} Z`
      : isStrong
      ? `M32.5 ${torsoTopY} C34 ${torsoTopY - 3}, 63 ${torsoTopY - 3}, 64.5 ${torsoTopY} L60.5 ${torsoBotY} L36.5 ${torsoBotY} Z`
      : isWoman
      ? `M38 ${torsoTopY} C40 ${torsoTopY - 2}, 57 ${torsoTopY - 2}, 58 ${torsoTopY} L55 54 L60 ${torsoBotY} L37 ${torsoBotY} L41 54 Z`
      : isChild
      ? `M38 ${torsoTopY} C39 ${torsoTopY - 2}, 57 ${torsoTopY - 2}, 58 ${torsoTopY} L57 ${torsoBotY} L39 ${torsoBotY} Z`
      : isElder
      ? `M36 ${torsoTopY} C38 ${torsoTopY - 1}, 59 ${torsoTopY - 1}, 60 ${torsoTopY} L58 ${torsoBotY} L38 ${torsoBotY} Z`
      : `M35.5 ${torsoTopY} C36.5 ${torsoTopY - 2}, 60.5 ${torsoTopY - 2}, 61.5 ${torsoTopY} L59.5 ${torsoBotY} L37.5 ${torsoBotY} Z`;

    return `
      <div class="aura-ring" style="--char-aura:${auraColor};"></div>
      <svg class="body-svg" viewBox="0 0 96 108" style="--char-aura:${auraColor};">
        <defs>
          <linearGradient id="${uid}_skin" x1="0" y1="0" x2="1" y2="1">
            ${skinStops}
          </linearGradient>
          <linearGradient id="${uid}_shirt" x1="0" y1="0" x2="1" y2="1">

  function setLog(txt) {
    document.getElementById("logBox").textContent = txt;
  }

  function playAnchorAnim(anchorEl, animClass, durationMs) {
    anchorEl.classList.remove("idle", "anim-melee", "anim-cast", "anim-hurt");
    void anchorEl.offsetWidth;
    anchorEl.classList.add(animClass);
    setTimeout(() => {
      anchorEl.classList.remove(animClass);
      anchorEl.classList.add("idle");
    }, durationMs);
  }

  function triggerCamera(camClass, durationMs = 680) {
    arena.classList.remove("cam-zoom-right", "cam-zoom-left", "cam-heavy-impact");
    void arena.offsetWidth;
    arena.classList.add(camClass);
    setTimeout(() => arena.classList.remove(camClass), durationMs);
  }

  function triggerFlash(xPercent = "72%") {
    impactFlash.style.setProperty("--fx-x", xPercent);
    impactFlash.classList.remove("active");
    void impactFlash.offsetWidth;
    impactFlash.classList.add("active");
  }

  function spawnDust(isRight) {
    const dust = document.createElement("div");
    dust.className = "dash-dust";
    dust.style[isRight ? "right" : "left"] = "48px";
    arena.appendChild(dust);
    setTimeout(() => dust.remove(), 460);
  }

  function spawnAfterimages(isRight) {
    [130, 210].forEach((offset, i) => {
      setTimeout(() => {
        const ghost = document.createElement("div");
        ghost.className = "afterimage";
        ghost.style[isRight ? "right" : "left"] = offset + "px";
        arena.appendChild(ghost);
        setTimeout(() => ghost.remove(), 350);
      }, i * 55);
    });
  }

  function spawnSlash(isRight, color = "#38bdf8", flip = false) {
    const arc = document.createElement("div");
    arc.className = "slash-arc";
    arc.style.setProperty("--arc-color", color);
    arc.style[isRight ? "right" : "left"] = "36px";
    if (flip) arc.style.transform = "scaleX(-1)";
    arena.appendChild(arc);
    setTimeout(() => arc.remove(), 360);
  }

  function spawnEnergyProjectile(emoji, color, fromVillain = false) {
    const proj = document.createElement("div");
    proj.className = "energy-projectile " + (fromVillain ? "to-left" : "to-right");
    proj.style.setProperty("--proj-color", color);
    proj.textContent = emoji;
    arena.appendChild(proj);
    setTimeout(() => proj.remove(), 400);
  }

  function spawnSparks(isRight, color, count = 7) {
    for (let i = 0; i < count; i++) {
      const sp = document.createElement("div");
      sp.className = "spark-particle";
      sp.style.setProperty("--spark-color", color);
      const angle = (Math.random() * 140 - 70) + (isRight ? 0 : 180);
      const dist = 35 + Math.random() * 45;
      const rad = angle * Math.PI / 180;
      sp.style.setProperty("--tx", Math.round(Math.cos(rad) * dist) + "px");
      sp.style.setProperty("--ty", Math.round(Math.sin(rad) * dist - 15) + "px");
      sp.style.setProperty("--ang", Math.round(angle) + "deg");
      sp.style[isRight ? "right" : "left"] = "58px";
      arena.appendChild(sp);
      setTimeout(() => sp.remove(), 430);
    }
  }

  function spawnShockwave(isRight, color) {
    const wave = document.createElement("div");
    wave.className = "shockwave";
    wave.style.borderColor = color;
    wave.style[isRight ? "right" : "left"] = "44px";
    arena.appendChild(wave);
    setTimeout(() => wave.remove(), 440);
  }

  function popDamage(text, isRight, color, offsetBottom = 135) {
    const el = document.createElement("div");
    el.className = "dmg-pop";
    el.textContent = text;
    el.style.color = color;
    el.style.bottom = offsetBottom + "px";
    el.style[isRight ? "right" : "left"] = "46px";
    arena.appendChild(el);
    setTimeout(() => el.remove(), 880);
  }

  function renderVillainRoster() {
    const roster = document.getElementById("villainRoster");
    roster.innerHTML = "";
    villainList.forEach((item, idx) => {
      const slot = document.createElement("div");
      const isDefeated = item.hp <= 0 || idx < vIdx;
      const isCurrent = idx === vIdx && vIdx < villainList.length && item.hp > 0;
      slot.className = "v-slot" + (isCurrent ? " current" : "") + (isDefeated ? " defeated" : "");
      const statusTxt = isDefeated ? "DOWN" : item.spell.name;
      slot.innerHTML = `<div class="v-nm">${item.name}</div><div class="v-st">${statusTxt}</div>`;
      roster.appendChild(slot);
    });
  }

  function render() {
    const h = heroes[hIdx];
    const v = villainList[Math.min(vIdx, villainList.length - 1)];

    applyVillainEnvironment(v);
    renderVillainRoster();

    document.getElementById("stageText").textContent = "Villain " + Math.min(vIdx + 1, villainList.length) + " / " + villainList.length;
    document.getElementById("comboText").textContent = "Combo: " + combo + "%";

    document.getElementById("hudHeroName").textContent = h.name;
    document.getElementById("hudHeroHp").textContent = Math.max(0, h.hp) + "/" + h.maxHp;
    document.getElementById("hudHeroPwrTxt").textContent = "PWR " + h.pwr + "/" + h.maxPwr;
    document.getElementById("hudHeroAtk").textContent = "ATK " + h.atk;
    document.getElementById("hudHeroBar").style.width = Math.max(0, (h.hp / h.maxHp) * 100) + "%";
    document.getElementById("hudHeroPwrBar").style.width = Math.max(0, (h.pwr / h.maxPwr) * 100) + "%";
    document.getElementById("hudHeroSpellName").textContent = h.spell.name;
    document.getElementById("hudHeroStatus").innerHTML = h.shielded ? `<span class="status-pill">🛡️ GUARD</span>` : "";
    document.getElementById("heroVisual").innerHTML = buildFighterVisual(h, false);

    document.getElementById("hudVillainName").textContent = v.name;
    document.getElementById("hudVillainHp").textContent = Math.max(0, v.hp) + "/" + v.maxHp;
    document.getElementById("hudZoneLabel").textContent = v.zone;
    document.getElementById("hudVillainAtk").textContent = "ATK " + v.atk;
    document.getElementById("hudVillainBar").style.width = Math.max(0, (v.hp / v.maxHp) * 100) + "%";
    document.getElementById("hudVillainSpellName").textContent = v.spell.name;
    let vStat = [];
    if (villainStunned) vStat.push("🌀 STUN");
    if (villainWeakened) vStat.push("❄️ WEAK");
    document.getElementById("hudVillainStatus").innerHTML = vStat.length ? `<span class="status-pill" style="background:rgba(248,113,113,0.22);color:#fca5a5;">${vStat.join(" ")}</span>` : "";
    document.getElementById("villainVisual").innerHTML = buildFighterVisual(v, true);

    document.getElementById("btnSklTitle").textContent = h.spell.name;
    document.getElementById("btnSklSub").textContent = h.spell.desc;

    const grid = document.getElementById("squadGrid");
    grid.innerHTML = "";
    heroes.forEach((member, idx) => {
      const card = document.createElement("div");
      card.className = "h-card" + (idx === hIdx && member.hp > 0 ? " active" : "") + (member.hp <= 0 ? " dead" : "");
      card.innerHTML = `
        <div class="nm">${member.name} <span style="font-size:8px;opacity:0.75;">(${member.label || ""})</span></div>
        <div class="sp">${member.spell.name}</div>
        <div class="hp">HP ${Math.max(0, member.hp)}</div>
        <div class="pw">PWR ${member.pwr}</div>
      `;
      card.onclick = () => {
        if (!busy && member.hp > 0) {
          hIdx = idx;
          spawnDust(false);
          render();
          setLog(member.name + " Arena ထဲ ဝင်လာပြီ! Spell: " + member.spell.name + " (" + member.spell.desc + ")");
        }
      };
      grid.appendChild(card);
    });

    const gameEnded = vIdx >= villainList.length || heroes.every(x => x.hp <= 0);
    document.getElementById("btnAtk").disabled = busy || gameEnded;
    document.getElementById("btnSkl").disabled = busy || gameEnded || h.pwr < h.spell.cost;
    document.getElementById("btnCharge").disabled = busy || gameEnded;
    document.getElementById("btnUlt").disabled = busy || gameEnded || combo < 100;


  }

  function villainCounterAttack(h, v) {
    setTimeout(() => {
      if (villainStunned) {
        villainStunned = false;
        spawnShockwave(true, "#c084fc");
        setLog("🌀 " + v.name + " ချုပ်နှောင်ခံထားရလို့ ဒီတစ်လှည့် ပြန်မတိုက်နိုင်ပါဘူး!");
        busy = false;
        render();
        return;
      }

      v.turnCount++;
      const useSpell = (v.turnCount % 2 === 0);
      let baseAtk = villainWeakened ? Math.round(v.atk * 0.72) : v.atk;
      villainWeakened = false;

      let rawDmg = useSpell ? Math.round(baseAtk * v.spell.mult) : baseAtk;
      let extraNote = "";

      if (useSpell) {
        playAnchorAnim(villainAnchor, "anim-cast", 720);
        triggerCamera("cam-zoom-left", 680);
        setTimeout(() => {
          spawnEnergyProjectile(v.spell.emoji, v.spell.color, true);
        }, 220);
      } else {
        playAnchorAnim(villainAnchor, "anim-melee", 760);
        triggerCamera("cam-zoom-left", 680);
        spawnDust(true);
        setTimeout(() => {
          spawnSlash(false, "#f43f5e", true);
        }, 290);
      }

      const impactDelay = useSpell ? 540 : 410;

      setTimeout(() => {
        if (h.shielded) {
          if (useSpell && v.spell.effect === "break_shield") {
            extraNote += " [⚙️ Iron Smash က Shield ကို ဖောက်ထွက်သွားတယ်!]";
          } else {
            rawDmg = Math.round(rawDmg * 0.35);
            extraNote += " [🛡️ Emerald Guard က 65% ကာကွယ်လိုက်တယ်!]";
          }
          h.shielded = false;
        }

        h.hp = Math.max(0, h.hp - rawDmg);
        playAnchorAnim(heroAnchor, "anim-hurt", 560);
        triggerCamera("cam-heavy-impact", 520);
        triggerFlash("22%");

        spawnShockwave(false, useSpell ? v.spell.color : "#f43f5e");
        spawnSparks(false, useSpell ? v.spell.color : "#f43f5e", useSpell ? 9 : 6);
        popDamage("-" + rawDmg, false, "#f43f5e", 135);

        if (useSpell) {
          if (v.spell.effect === "drain_pwr") {
            h.pwr = Math.max(0, h.pwr - 20);
            popDamage("-20 PWR", false, "#c084fc", 168);
            extraNote += " (PWR -20 ခံလိုက်ရသည်!)";
          } else if (v.spell.effect === "cut_combo") {
            combo = Math.max(0, combo - 25);
            extraNote += " (Combo -25% လျော့သွားသည်!)";
          } else if (v.spell.effect === "v_heal") {
            v.hp = Math.min(v.maxHp, v.hp + 50);
            popDamage("+50 HP", true, "#4ade80", 168);
            extraNote += " (" + v.name + " HP +50 ပြန်တက်သွားသည်!)";
          }
        }

        let msg = useSpell
          ? v.name + " က [" + v.spell.name + "] သုံးပြီး " + h.name + " ကို -" + rawDmg + " ထိအောင် ပစ်လိုက်တယ်!" + extraNote
          : v.name + " ပြန်တိုက်တော့ " + h.name + " HP -" + rawDmg + " လျော့သွားတယ်!" + extraNote;

        if (h.hp <= 0) {
          const next = heroes.findIndex(x => x.hp > 0);
          if (next === -1) {
            setLog("😵 မိသားစုအားလုံး အားကုန်သွားပါပြီ! Page ကို Refresh လုပ်ပြီး ပြန်စနိုင်ပါတယ်။");
            busy = false;
            render();
            return;
          }
          hIdx = next;
          msg += " (" + heroes[hIdx].name + " အစားထိုး ဝင်လာပြီ)";
        }

        setLog(msg);
        busy = false;
        render();
      }, impactDelay);
    }, 760);
  }

  function chargePowerFlow() {
    if (busy || vIdx >= villainList.length) return;
    const h = heroes[hIdx];
    const v = villainList[vIdx];
    if (!h || h.hp <= 0) return;

    busy = true;
    playAnchorAnim(heroAnchor, "anim-cast", 680);
    h.pwr = Math.min(h.maxPwr, h.pwr + 35);
    h.hp = Math.min(h.maxHp, h.hp + 15);
    combo = Math.min(100, combo + 15);

    spawnShockwave(false, "#38bdf8");
    spawnSparks(false, "#38bdf8", 7);
    popDamage("+35 PWR", false, "#38bdf8", 135);
    popDamage("+15 HP", false, "#4ade80", 168);
    setLog(h.name + " ပါဝါစုလိုက်ပြီ! (PWR " + h.pwr + "/" + h.maxPwr + ", HP +15)");
    render();

    villainCounterAttack(h, v);
  }

  function attackFlow(mode) {
    if (busy || vIdx >= villainList.length) return;
    const h = heroes[hIdx];
    const v = villainList[vIdx];
    if (!h || h.hp <= 0) return;

    const sp = h.spell;
    if (mode === "skill" && h.pwr < sp.cost) {
      setLog("⚠️ " + sp.name + " သုံးဖို့ PWR " + sp.cost + " လိုတယ် — Focus Charge နှိပ်ပြီး ပါဝါဖြည့်ပါ!");
      return;
    }

    busy = true;
    render();

    let mult = 1;
    let spellNote = "";

    if (mode === "skill") {
      h.pwr = Math.max(0, h.pwr - sp.cost);
      mult = sp.mult;
      combo = Math.min(100, combo + (sp.comboGain || 35));
    } else if (mode === "melee") {
      h.pwr = Math.min(h.maxPwr, h.pwr + 12);
      combo = Math.min(100, combo + 25);
    } else if (mode === "ult") {
      mult = 3.7;
      combo = 0;
    }

    const dmg = Math.round(h.atk * mult);

    // 1. Smooth Realistic Wind-up & Strike Animation
    if (mode === "melee") {
      playAnchorAnim(heroAnchor, "anim-melee", 780);
      triggerCamera("cam-zoom-right", 680);
      spawnDust(false);
      setTimeout(() => spawnAfterimages(false), 140);
      // First Jab Slash
      setTimeout(() => {
        spawnSlash(true, "#38bdf8", false);
        spawnSparks(true, "#38bdf8", 4);
      }, 280);
      // Second Heavy Cross Slash
      setTimeout(() => {
        spawnSlash(true, "#facc15", true);
      }, 410);
    } else if (mode === "skill") {
      playAnchorAnim(heroAnchor, "anim-cast", 720);
      triggerCamera("cam-zoom-right", 680);
      spawnDust(false);
      setTimeout(() => {
        spawnEnergyProjectile(sp.emoji, sp.color, false);
      }, 240);
    } else {
      playAnchorAnim(heroAnchor, "anim-cast", 750);
      triggerCamera("cam-zoom-right", 720);
      spawnDust(false);
      setTimeout(() => {
        spawnEnergyProjectile("🔥☄️", "#fb923c", false);
      }, 220);
    }

    const impactDelay = mode === "melee" ? 430 : 560;

    // 2. Synchronized Impact & Knockback Physics
    setTimeout(() => {
      v.hp = Math.max(0, v.hp - dmg);
      playAnchorAnim(villainAnchor, "anim-hurt", 560);
      triggerCamera("cam-heavy-impact", 520);
      triggerFlash("78%");

      const fxColor = mode === "ult" ? "#fb923c" : (mode === "skill" ? sp.color : "#facc15");
      spawnShockwave(true, fxColor);
      spawnSparks(true, fxColor, mode === "melee" ? 7 : 11);
      popDamage("-" + dmg, true, fxColor, 135);

      if (mode === "skill") {
        if (sp.type === "heal_self") {
          h.hp = Math.min(h.maxHp, h.hp + sp.healAmt);
          popDamage("+" + sp.healAmt + " HP", false, "#4ade80", 135);
          spellNote = " (" + h.name + " HP +" + sp.healAmt + " ပြန်တက်!)";
        } else if (sp.type === "lifesteal") {
          const steal = Math.round(dmg * sp.ratio);
          h.hp = Math.min(h.maxHp, h.hp + steal);
          popDamage("+" + steal + " HP", false, "#f472b6", 135);
          spellNote = " (သွေး +" + steal + " စုပ်ယူနိုင်!)";
        } else if (sp.type === "team_heal") {
          heroes.forEach(m => {
            if (m.hp > 0) m.hp = Math.min(m.maxHp, m.hp + sp.healAmt);
          });
          popDamage("TEAM +" + sp.healAmt, false, "#4ade80", 135);
          spellNote = " (မိသားစုအားလုံး HP +" + sp.healAmt + " တက်!)";
        } else if (sp.type === "stun") {
          villainStunned = true;
          spellNote = " (" + v.name + " ကို ၁ လှည့် ချုပ်ထားလိုက်ပြီ!)";
        } else if (sp.type === "shield") {
          h.shielded = true;
          spellNote = " (Emerald Shield ကာကွယ်မှု ရရှိ!)";
        } else if (sp.type === "weaken") {
          villainWeakened = true;
          spellNote = " (" + v.name + " အေးခဲပြီး ATK လျော့သွား!)";
        }
      }

      render();

      if (v.hp <= 0) {
        villainStunned = false;
        villainWeakened = false;
        setLog(h.name + " ရဲ့ ပြင်းထန်တဲ့ တိုက်ချက်ကြောင့် " + v.name + " လဲကျသွားပြီ!");
        setTimeout(() => {
          vIdx++;
          if (vIdx >= villainList.length) {
            setLog("🏆 ဗီလိန် ၈ ယောက်စလုံး ရှုံးသွားပြီ — မိသားစု အပြတ်အသတ် အနိုင်ရပါပြီ!");
            busy = false;
            render();
          } else {
            const nextV = villainList[vIdx];
            setLog(nextV.name + " (" + nextV.zone + " | Spell: " + nextV.spell.name + ") ဝင်လာပြီ!");
            busy = false;
            render();
          }
        }, 720);
        return;
      }

      const actionTitle = mode === "skill" ? "[" + sp.name + "]" : (mode === "ult" ? "[8-Family All-Out]" : "1-2 Dash Combo");
      setLog(h.name + " က " + actionTitle + " နဲ့ " + v.name + " ကို -" + dmg + " ချလိုက်ပြီ!" + spellNote);
      villainCounterAttack(h, v);

    }, impactDelay);
  }

  document.getElementById("btnAtk").onclick = () => attackFlow("melee");
  document.getElementById("btnSkl").onclick = () => attackFlow("skill");
  document.getElementById("btnCharge").onclick = () => chargePowerFlow();
  document.getElementById("btnUlt").onclick = () => {
    if (combo >= 100) attackFlow("ult");
  };



  render();
})();
</script>
</body>
</html>
